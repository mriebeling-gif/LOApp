<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Flappy Browser</h1>
      <canvas id="gameCanvas" width="420" height="680" aria-label="Flappy Bird Clone"></canvas>
      <p class="hint">
        Press <kbd>Space</kbd> / Click / Tap to flap.<br />
        Press <kbd>R</kbd> to restart after game over.
      </p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
