[project]
name = "vaforge"
version = "0.1.0"
description = "VAForge - Ocrolus for VA loans"
requires-python = ">=3.11"
authors = [{name = "VAForge Contributors"}]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "redis>=5.1.0",
  "httpx>=0.27.0",
  "python-dateutil>=2.9.0",
  "reportlab>=4.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
